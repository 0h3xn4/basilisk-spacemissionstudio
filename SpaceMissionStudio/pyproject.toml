[project]
name = "spacemissionstudio"
version = "2.0.0"
description = "Standalone GUI mission-analysis application built on the Basilisk astrodynamics framework"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "ISC" }
authors = [
    { name = "SpaceMissionStudio contributors" },
]
# Basilisk itself is deliberately NOT listed here: this project targets a
# specific Basilisk build (see README.md's "Vendoring vs. building from
# source" note), which is not something pip can resolve as an ordinary
# dependency. numpy is the only hard runtime dependency of the
# Basilisk-independent modules (schema, spaceweather, results); everything
# in engine/ that talks to Basilisk obviously also needs a Basilisk build
# on PYTHONPATH, arranged separately (see README.md).
# sgp4 (Vallado's SGP4) and pyerfa (ERFA, the BSD-licensed SOFA library)
# convert TLEs to the simulation frame (engine/tle.py, ECSS-E-ST-10-09C
# 5.3.1b); both are pure offline libraries.
dependencies = [
    "numpy>=1.24.4",
    "sgp4>=2.20",
    "pyerfa>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-qt>=4.4.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
]
# PySide6 for the widgets; PySide6's own "PySide6" package pulls in
# PySide6_Addons (which bundles QtWebEngineWidgets -- confirmed directly
# in this project's own dev sandbox, not assumed) as a REQUIRED
# dependency, so no separate WebEngine package is needed here. plotly
# (results_widget.py's plots, embedded via QWebEngineView -- see that
# module's own docstring for why, and for the real bug -- matplotlib's
# default scientific/offset-notation axis formatting -- this migration
# fixes) needs >=5 for a stable graph_objects API; not pinned tighter
# than that since nothing here uses a version-specific feature.
gui = [
    "PySide6>=6.6",
    "plotly>=5.0",
]

[project.scripts]
spacemissionstudio = "spacemissionstudio.cli:main"

[build-system]
requires = ["setuptools>=70.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spacemissionstudio*"]

# spacemissionstudio/scenarios/*.json (the two-body validation scenario and any
# future example scenarios) has no __init__.py, so packages.find() above
# never picks it up as a package -- found by actually building the wheel
# (python -m build) and inspecting its contents, not assumed: without this,
# `spacemissionstudio validate spacemissionstudio/scenarios/two_body_validation.json`
# and the "Running a scenario" README example would 404 the moment
# spacemissionstudio was installed from a wheel instead of run from a checkout.
# scenarios/templates/*.json (the education/starter-template scenarios --
# see that directory's own README) is a separate glob for the same reason:
# setuptools package-data globs are not recursive, so "scenarios/*.json"
# alone would silently drop everything one directory deeper.
# gui/assets/*.svg are the theme's combo/spin arrow and check-mark glyphs
# (see gui/theme.py) -- no __init__.py there either, same reason.
[tool.setuptools.package-data]
spacemissionstudio = ["scenarios/*.json", "scenarios/templates/*.json", "scenarios/templates/README.md",
                      "gui/assets/*.svg", "data/spaceweather/SW-All.txt", "data/spaceweather/oct2026f10-prd.txt",
                      "data/spaceweather/README.md", "help/USER_MANUAL.md", "help/docs/images/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

# Coding standard (compliance/docs/coding_standard.md; ECSS-Q-ST-80C 6.3.4,
# remediation R10). pyflakes, pycodestyle errors/warnings and bugbear; the
# 120-character limit applies to new code (E501 is not enforced on the
# existing lines). B023: the progress/add closures in long_run.py and
# propellant_budget.py are called inside the iteration that defines them,
# so late binding is intended. B007: loop counters kept for readability.
[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# S (flake8-bandit): security rules, added by the R15 security analysis
# (compliance/docs/security_analysis.md). Each remaining finding in the
# package carries a noqa with its justification.
select = ["E4", "E7", "E9", "F", "W", "B", "S"]
ignore = ["B007", "B023"]

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101) and use temporary paths (S108); the scripts and the
# compliance tools run git and parse their own JUnit XML: trusted local
# input, not the shipped tool.
"tests/**" = ["S"]
"scripts/**" = ["S"]
"compliance/**" = ["S"]
