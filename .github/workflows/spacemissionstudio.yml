# SpaceMissionStudio: lint, tests with coverage, metrics and compliance
# builds (SpaceMissionStudio/compliance/docs/coding_standard.md; ECSS-Q-ST-80C
# 6.3.4.6, 7.1.5; ECSS-E-ST-40C 5.8.3.5; remediations R10-R12). Runs against
# the qualified Basilisk release from PyPI, not a source build, so it does
# not touch the Basilisk framework jobs.
name: "SpaceMissionStudio"

on:
  push:
    paths:
      - "SpaceMissionStudio/**"
      - ".github/workflows/spacemissionstudio.yml"
  pull_request:
    paths:
      - "SpaceMissionStudio/**"
      - ".github/workflows/spacemissionstudio.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: SpaceMissionStudio
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # metrics.py counts corrective commits
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64
      - name: Install the tool, the qualified Basilisk release and the dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "bsk==2.12.0"
          python -m pip install -e ".[dev,gui]"
      - name: Lint (coding standard C-8)
        run: python -m ruff check spacemissionstudio tests scripts compliance/tools
      - name: Documents complete against their DRDs and generated parts current (R14)
        run: |
          python compliance/tools/check_drds.py
          python compliance/tools/build_icd_schema.py
          python compliance/tools/build_sdd_components.py
          python compliance/tools/build_test_specs.py
          git diff --exit-code -- compliance/docs
      - name: IERS-based Earth orientation files for the validation cases (SVS VP-1)
        run: spacemissionstudio earth-orientation --fetch
      - name: Tests with coverage (C-9, C-10)
        run: >
          python -m pytest tests -q -n auto -p no:cacheprovider
          --cov=spacemissionstudio --cov-branch --cov-report=json:coverage.json --cov-report=term
          --junitxml=test-report.xml
      - name: Metrics and statement coverage >= 90 % (C-7, C-10)
        if: always()
        run: python compliance/tools/metrics.py --coverage coverage.json --junit test-report.xml --fail-under 90 --fail-under-branch 80
      - name: Traceability, ICS and compliance matrix
        if: always()
        run: |
          python compliance/tools/build_traceability.py
          python compliance/tools/build_ics.py
          python compliance/tools/build_matrix.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: spacemissionstudio-quality
          path: |
            SpaceMissionStudio/test-report.xml
            SpaceMissionStudio/coverage.json
            SpaceMissionStudio/compliance/metrics.md
            SpaceMissionStudio/compliance/metrics.json
            SpaceMissionStudio/compliance/traceability_matrix.csv
            SpaceMissionStudio/compliance/compliance_matrix.csv
            SpaceMissionStudio/compliance/ics_ccsds_502.csv
